<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://pedroavila.me/" />

    <title>Pedro Ávila — Senior Product Designer</title>
    <meta name="description"
        content="Senior Product Designer in Berlin, rebuilding how design gets done — with AI, in production code. Design systems, design ops and design-to-code workflows." />

    <!-- Open Graph / social previews. These are the static defaults the site
         ships with; routes are rendered client-side, so link scrapers always
         see this card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pedro Ávila" />
    <meta property="og:url" content="https://pedroavila.me/" />
    <meta property="og:title" content="Pedro Ávila — Senior Product Designer" />
    <meta property="og:description"
        content="Senior Product Designer in Berlin, rebuilding how design gets done — with AI, in production code. Design systems, design ops and design-to-code workflows." />
    <meta property="og:image" content="https://pedroavila.me/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pedro Ávila — Rebuilding how design gets done." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pedro Ávila — Senior Product Designer" />
    <meta name="twitter:description"
        content="Senior Product Designer in Berlin, rebuilding how design gets done — with AI, in production code. Design systems, design ops and design-to-code workflows." />
    <meta name="twitter:image" content="https://pedroavila.me/og-image.jpg" />
</head>

<body>
    <div id="root"></div>
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(null, null,
            decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
